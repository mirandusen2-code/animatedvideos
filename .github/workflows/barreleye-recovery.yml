name: Render the barreleye Short
on:
  push:
    branches: [codex/barreleye-recovery-render]
    paths:
      - '.github/workflows/barreleye-recovery.yml'
      - 'barreleye/recovery/**'
permissions:
  contents: read
jobs:
  movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: barreleye
        shell: bash
    env:
      PIP_NO_CACHE_DIR: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: barreleye
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the original narration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0 libgl1
          mkdir -p vo/clips qa frames
          python -m venv "$RUNNER_TEMP/guide"
          "$RUNNER_TEMP/guide/bin/pip" install kokoro-onnx soundfile
          export KOKORO_MODEL="$RUNNER_TEMP/kokoro.onnx" KOKORO_VOICES="$RUNNER_TEMP/voices.bin"
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o "$KOKORO_MODEL"
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o "$KOKORO_VOICES"
          "$RUNNER_TEMP/guide/bin/python" voiceover.py --guide
          python -m venv "$RUNNER_TEMP/narrator"
          source "$RUNNER_TEMP/narrator/bin/activate"
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install chatterbox-tts faster-whisper soundfile scipy
          python voiceover.py
          python realign.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render the original scene and soundtrack
        run: |
          python -m venv "$RUNNER_TEMP/scene"
          source "$RUNNER_TEMP/scene/bin/activate"
          pip install 'bpy==5.2.3' pillow scipy soundfile imageio-ffmpeg opencv-python-headless
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf' -o Montserrat.ttf
          bash render_missing.sh > "$RUNNER_TEMP/cycles.log" 2>&1 || { tail -50 "$RUNNER_TEMP/cycles.log"; exit 1; }
          python post.py all
          python qa_motion.py
          "$RUNNER_TEMP/narrator/bin/python" check_transcript.py
          sha256sum barreleye.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: barreleye-mp4
          path: |
            barreleye/barreleye.mp4
            barreleye/barreleye.srt
            barreleye/qa/measurements.json
            barreleye/qa/final-asr.json
          if-no-files-found: error
          retention-days: 14
