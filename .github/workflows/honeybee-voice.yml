name: Honeybee narration and word timing
on:
  push:
    branches: [codex/honeybee-dance]
    paths: ['.github/workflows/honeybee-voice.yml','honeybee-dance/voiceover.py','honeybee-dance/realign.py','honeybee-dance/script.py']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: honeybee-dance
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: honeybee-dance
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          pip install kokoro-onnx soundfile scipy faster-whisper
          export KOKORO_MODEL="$RUNNER_TEMP/kokoro.onnx" KOKORO_VOICES="$RUNNER_TEMP/voices.bin"
          curl --retry 3 -fsSL https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o "$KOKORO_MODEL"
          curl --retry 3 -fsSL https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o "$KOKORO_VOICES"
          python voiceover.py
          python realign.py
      - uses: actions/cache/save@v4
        with:
          path: |
            honeybee-dance/vo/timing.json
            honeybee-dance/vo/narration.wav
          key: honeybee-voice-v1-${{ hashFiles('honeybee-dance/script.py','honeybee-dance/realign.py','honeybee-dance/voiceover.py') }}
      - uses: actions/upload-artifact@v4
        with:
          name: honeybee-word-times
          path: |
            honeybee-dance/vo/timing.json
            honeybee-dance/vo/words-review.json
          retention-days: 7
